name: Daily essay

on:
  # Odd minute: GitHub drops on-the-hour scheduled runs under load, and a dropped
  # day here is a day with no essay. 20:19 UTC is 06:19 Sydney, and sits after both
  # free tiers roll over (Gemini at midnight Pacific, Cloudflare at 00:00 UTC).
  schedule:
    - cron: "19 20 * * *"
  workflow_dispatch:
    inputs:
      until:
        description: "Top every writer up to this many essays (blank = one essay)"
        required: false
        default: ""
      jobs:
        description: "essays | reverdict | portraits | all"
        required: false
        default: "essays"

env:
  # Every writer should have at least this many before the site settles into one a
  # day. Until then each run writes as many as the free tiers allow and stops - a
  # spent quota is exit 3, which is a normal end, not a failure.
  MIN_PER_WRITER: "2"

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pillow is only used by tools/portraits.py, which was a local-only tool until
      # it was wired into this workflow. Its absence took a run down.
      - run: pip install --quiet requests pyyaml pillow

      # Cheap, and it runs BEFORE anything that costs a quota call. A writer added to
      # styles/ but not to the portraits LOOK map used to surface as a KeyError three
      # steps later, which skipped the commit and threw away the work of the steps
      # that had already succeeded.
      - name: Is the roster wired up
        run: python tests/test_roster.py

      - name: Write
        # The nightly cron must never depend on the jobs input. On a scheduled run
        # github.event.inputs is null, so the old condition rode on null == ''
        # coercing to true - and if that ever stopped holding, the daily essay would
        # stop with no error anywhere. The schedule path is now unconditional.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == '' || inputs.jobs == 'essays' || inputs.jobs == 'all' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Locally llm.py falls back to Cloudflare when Gemini's day is spent. CI had
          # no such fallback, so a spent Gemini day was a missed essay. Empty until
          # the two secrets are added to the repo, which llm.py handles as "no
          # provider" rather than an error.
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          UNTIL: ${{ github.event.inputs.until }}
        run: |
          set +e
          python run.py --until "${UNTIL:-$MIN_PER_WRITER}"
          code=$?
          set -e
          # 0 = everyone is topped up. 3 = the free tiers are spent for the day, and
          # whatever it managed is already written and rendered. Anything else is real.
          if [ "$code" -eq 3 ]; then
            echo "::notice::free quota spent for the day - keeping what was written"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      # Verdicts that came back as grades rather than as the writer's own words.
      # Manual only: it re-reads published essays, which is not something a nightly
      # job should do to a page that is already correct.
      - name: Re-read the grade-ish verdicts
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.jobs == 'reverdict' || inputs.jobs == 'all') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python tools/reverdict.py

      # Only draws writers that have no portrait yet, so it is safe to re-run.
      - name: Draw any missing portraits
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.jobs == 'portraits' || inputs.jobs == 'all') }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python tools/portraits.py

      # Runs AFTER the essays land, so a collapse shows up on the day it happens
      # rather than whenever someone next reads two pages.
      - name: Are the voices still distinct
        id: voice
        if: ${{ !cancelled() }}
        run: python tests/test_voice.py

      # Runs even when an earlier step failed, because the steps are independent and
      # the expensive ones come first. Twice on 26/08/2026 a portraits failure - once a
      # KeyError, once a missing Pillow - skipped this step and threw away a completed
      # reverdict pass over seventeen essays that had already been written to disk. The
      # job still reports failure; it just does not take finished work down with it.
      - name: Commit
        if: ${{ !cancelled() && steps.voice.outcome != 'failure' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "essays: $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push attempt $attempt lost a race - replaying onto master"
            git fetch origin master || true
            git reset --soft origin/master
            git add data docs
            git diff --cached --quiet && exit 0
            git commit -m "essays: $(date -u +%Y-%m-%d)"
            sleep 3
          done
          echo "::error::could not push after 3 attempts"
          exit 1

      # This repo is private, and GitHub Pages will not serve a private repo on the
      # free plan - the live site is charlietrenorden.com/ghostwriters/, a folder
      # inside the public hub repo. So publishing means copying docs/ across. Without
      # this the daily essay lands here and never reaches the site.
      #
      # HUB_TOKEN is a fine-grained PAT with Contents: read and write on
      # charlie-tren/charlie-tren.github.io. Until it exists the step skips loudly
      # rather than failing the run.
      - name: Publish to the hub
        if: ${{ !cancelled() && steps.voice.outcome != 'failure' }}
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          if [ -z "$HUB_TOKEN" ]; then
            echo "::warning::HUB_TOKEN not set - the essay is committed here but NOT live"
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${HUB_TOKEN}@github.com/charlie-tren/charlie-tren.github.io.git" hub
          rm -rf hub/ghostwriters
          cp -r docs hub/ghostwriters
          cd hub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghostwriters
          if git diff --cached --quiet; then
            echo "hub already up to date"
            exit 0
          fi
          git commit -m "ghostwriters: $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "hub push attempt $attempt lost a race - replaying onto main"
            git fetch origin main
            git reset --soft origin/main
            git add ghostwriters
            git diff --cached --quiet && exit 0
            git commit -m "ghostwriters: $(date -u +%Y-%m-%d)"
            sleep 3
          done
          echo "::error::could not push to the hub after 3 attempts"
          exit 1
