name: Daily essay

on:
  # Odd minute: GitHub drops on-the-hour scheduled runs under load, and a dropped
  # day here is a day with no essay. 20:19 UTC is 06:19 Sydney, and sits well after
  # Gemini rolls over at midnight Pacific (07:00 UTC), which is the provider the
  # essays actually run on.
  #
  # Cloudflare does NOT reset at 00:00 UTC. Measured on 28/08/2026: about 31 images
  # were drawn between 23:20 and 23:35 UTC on the 27th, and the account was still
  # answering "you have used up your daily free allocation of 10,000 neurons" at
  # 04:12 UTC the next day - four hours past midnight. It behaves as a rolling window
  # from the spend, not a calendar day, so a heavy evening costs the following
  # evening too. There is no reset header on the 429 to read.
  #
  # It only matters for the portraits step below, which is why that step is
  # continue-on-error and simply tries again the next night. The essays run on
  # Gemini, which does reset at midnight Pacific.
  schedule:
    - cron: "19 17 * * *"   # 17:19 UTC / 03:19 AEST - primary
    #
    # MOVED 3 HOURS EARLIER, 01/09/2026, and the reason is arithmetic rather than
    # taste. This cron said 20:19 and the run actually STARTED 22:41, 22:49,
    # 02:50 and 04:23 on the last four days - GitHub delivers this account's
    # scheduled work 2 to 6 hours late. The essay was therefore published after
    # 22:41 UTC, which is 08:41 Sydney, and Charlie reads the site at 07:55. The
    # hub, which copies these essays in, pulls at 21:53 - BEFORE the generator
    # had run at all - so it copied yesterday's essay every single day and both
    # repos logged success.
    #
    # Arrival is cron + lateness, so moving the cron earlier moves the arrival
    # earlier by the same amount: 17:19 plus the observed worst case still lands
    # around 21:20 UTC, ahead of the hub's pull and ahead of him.
    #
    # This narrows the window; it does not close it. The reliable fix is the
    # heartbeat Worker (site-stats/heartbeat), which fires this from Cloudflare
    # in a slot BEFORE the hub's pull, so the order is guaranteed rather than
    # hoped for. Keep both.
    - cron: "19 21 * * *"   # 21:19 UTC - late backup, in case the primary is dropped
  workflow_dispatch:
  # Fired by the heartbeat Worker (site-stats/heartbeat) from OUTSIDE GitHub
  # Actions. Added 01/09/2026: this cron says 20:19 UTC and has actually been
  # starting 22:41-22:49, and on two of the last four days 02:50 and 04:23. The
  # hub pulls these essays at 21:53, so the CONSUMER was running an hour before
  # the PRODUCER and copied yesterday's essay every single day.
  #
  # The step conditions below key on `!= 'workflow_dispatch'`, so a
  # repository_dispatch runs the essay job without any of them needing to change.
  repository_dispatch:
    types: [heartbeat]
    inputs:
      until:
        description: "Top every writer up to this many essays (blank = one essay)"
        required: false
        default: ""
      jobs:
        description: "essays | reverdict | portraits | all"
        required: false
        default: "essays"
      only:
        description: "portraits: comma-separated writer ids, blank = every writer missing one"
        required: false
        default: ""
      model:
        description: "portraits: flux | sdxl | lightning | dreamshaper"
        required: false
        default: "flux"
      preview:
        description: "portraits: yes = draw to a throwaway dir and upload, do not touch the live set"
        required: false
        default: "no"
      tries:
        description: "portraits + preview: how many candidates to draw per writer"
        required: false
        default: "1"

env:
  # Every writer should have at least this many before the site settles into one a
  # day. Until then each run writes as many as the free tiers allow and stops - a
  # spent quota is exit 3, which is a normal end, not a failure. --cover does the
  # same for SUBJECTS, and runs first: a subject on nought is an empty shelf on a
  # site whose index IS the list of subjects.
  MIN_PER_WRITER: "2"

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pillow is only used by tools/portraits.py, which was a local-only tool until
      # it was wired into this workflow. Its absence took a run down.
      - run: pip install --quiet requests pyyaml pillow

      # Cheap, and it runs BEFORE anything that costs a quota call. A writer added to
      # styles/ but not to the portraits LOOK map used to surface as a KeyError three
      # steps later, which skipped the commit and threw away the work of the steps
      # that had already succeeded.
      - name: Is the roster wired up
        run: python tests/test_roster.py

      # Also cheap and also before anything that spends a quota: it draws 500 pairings
      # in memory and writes nothing.
      - name: Does the pairing cover every subject
        run: python tests/test_pick.py

      - name: Write
        # The nightly cron must never depend on the jobs input. On a scheduled run
        # github.event.inputs is null, so the old condition rode on null == ''
        # coercing to true - and if that ever stopped holding, the daily essay would
        # stop with no error anywhere. The schedule path is now unconditional.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == '' || inputs.jobs == 'essays' || inputs.jobs == 'all' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Locally llm.py falls back to Cloudflare when Gemini's day is spent. CI had
          # no such fallback, so a spent Gemini day was a missed essay. Empty until
          # the two secrets are added to the repo, which llm.py handles as "no
          # provider" rather than an error.
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          UNTIL: ${{ github.event.inputs.until }}
        run: |
          set +e
          python run.py --cover --until "${UNTIL:-$MIN_PER_WRITER}"
          code=$?
          set -e
          # 0 = everyone is topped up. 3 = the free tiers are spent for the day, and
          # whatever it managed is already written and rendered. Anything else is real.
          if [ "$code" -eq 3 ]; then
            echo "::notice::free quota spent for the day - keeping what was written"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      # Put any score written by the fallback model back on the canonical scale.
      # AFTER the essay, so today's piece always gets first call on the day's quota,
      # and capped so a long repair queue cannot spend the whole tier in one night.
      # It is self-limiting: `scored_by` records progress, so an interrupted run
      # resumes tomorrow rather than starting over, and once the archive is converged
      # this step finds nothing and costs one line of output.
      - name: Put the scores back on one scale
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python tools/rescore.py --limit 8

      # Verdicts that came back as grades rather than as the writer's own words.
      # Manual only: it re-reads published essays, which is not something a nightly
      # job should do to a page that is already correct.
      - name: Re-read the grade-ish verdicts
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.jobs == 'reverdict' || inputs.jobs == 'all') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python tools/reverdict.py

      # With no inputs this only draws writers that have no portrait yet, so it is
      # safe to re-run. `only` redraws named writers over the top of the live files;
      # `preview: yes` draws into a throwaway directory and uploads it instead, which
      # is the only way to see a model or STYLE change before it replaces the set.
      - name: Draw portraits
        # Runs on the SCHEDULE too, as of 28/08/2026. With no inputs the tool draws only
        # writers who have no portrait, so on a settled roster this costs one line of
        # output and nothing else - and on the night a writer is added it closes the gap
        # by itself. Adding five writers on a spent image tier was what made the case:
        # the alternative is a name with no face until somebody remembers to dispatch it.
        # continue-on-error because a portrait is an ornament and the essays are the
        # site; a 429 here must not take down a run that has already written.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'portraits' || inputs.jobs == 'all' }}
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Empty until the key exists, which portraits.py reads as "one provider".
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          ONLY: ${{ inputs.only }}
          MODEL: ${{ inputs.model }}
          PREVIEW: ${{ inputs.preview }}
          TRIES: ${{ inputs.tries }}
        run: |
          args="--model=${MODEL:-flux}"
          if [ -n "$ONLY" ]; then args="$args --only=$ONLY"; fi
          if [ "$PREVIEW" = "yes" ]; then args="$args --force --out=docs/faces/_preview --tries=${TRIES:-1}"; fi
          echo "portraits.py $args"
          python tools/portraits.py $args

      # The pages were rendered inside the Write step, BEFORE any portrait drawn above
      # existed, and render.face() omits a portrait it cannot find. Without this a face
      # drawn tonight would not appear on the site until some later run happened to
      # rebuild the pages - the file would be committed and invisible.
      - name: Re-render, now the faces exist
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python -c "
          import json, styles, render
          render.build(json.load(open('data/essays.json')), styles.load())
          "

      # A preview is never committed - docs/faces/_preview is gitignored so the
      # Commit step's `git add docs` cannot sweep it into the live site by accident.
      - name: Keep the preview for inspection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.preview == 'yes' }}
        uses: actions/upload-artifact@v7
        with:
          name: portraits-preview-${{ inputs.model }}
          path: docs/faces/_preview/
          if-no-files-found: error

      # Not gated to the commit, deliberately: the essays and the repairs are already
      # on disk by now, and the lesson recorded on the Commit step below is that a
      # failure here should mark the job red without throwing away finished work.
      # After the essay, so the slug and reflow checks run over the archive as
      # published rather than as it was an hour ago. Same treatment as the two below:
      # it marks the job red without blocking the commit of work already on disk.
      # Cheap and pure, so it runs with the other joins BEFORE anything spends quota:
      # a gate that has stopped firing should be found before the day's essay is
      # written against it, not after.
      - name: Do the gates still fire
        if: ${{ !cancelled() }}
        run: python tests/test_critic.py

      - name: Does the renderer do what it says
        if: ${{ !cancelled() }}
        run: python tests/test_render.py

      - name: Are the scores one measurement
        if: ${{ !cancelled() }}
        run: python tests/test_scores.py

      # Runs AFTER the essays land, so a collapse shows up on the day it happens
      # rather than whenever someone next reads two pages.
      - name: Are the voices still distinct
        id: voice
        if: ${{ !cancelled() }}
        run: python tests/test_voice.py

      # Runs even when an earlier step failed, because the steps are independent and
      # the expensive ones come first. Twice on 26/08/2026 a portraits failure - once a
      # KeyError, once a missing Pillow - skipped this step and threw away a completed
      # reverdict pass over seventeen essays that had already been written to disk. The
      # job still reports failure; it just does not take finished work down with it.
      - name: Commit
        if: ${{ !cancelled() && steps.voice.outcome != 'failure' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "essays: $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push attempt $attempt lost a race - replaying onto master"
            git fetch origin master || true
            git reset --soft origin/master
            git add data docs
            git diff --cached --quiet && exit 0
            git commit -m "essays: $(date -u +%Y-%m-%d)"
            sleep 3
          done
          echo "::error::could not push after 3 attempts"
          exit 1

      # Publishing is the hub's job, not this one's. The live site is
      # charlietrenorden.com/ghostwriters/, a folder inside the public hub repo, and
      # the "Pull Ghostwriters" workflow THERE clones this repo and copies docs/
      # across using its own GITHUB_TOKEN - so no PAT exists on either side. It runs
      # at 21:53 UTC, an hour and a half after this job writes.
      #
      # A HUB_TOKEN push step used to sit here. The secret was never set, so it
      # warned "the essay is committed here but NOT live" on every single run - which
      # was false from the moment the hub workflow landed, and sent this session
      # looking for a broken deploy that did not exist. Removed 28/08/2026.
