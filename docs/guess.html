ealm, but in the mind. The artificial challenges that surround me are but a pale reflection of the real struggles that beset us all. And yet, I must acknowledge the fleeting pleasure that comes from overcoming these trivial hurdles.", "w": 1, "e": "2026-08-25-aurelius-escape-rooms", "o": "escape rooms"}, {"t": "It is 3:14 in the morning in a hotel room in Omaha. The phone lit up on the nightstand. Someone in London was typing about a coat. Someone in New York was sending an image of a dog. I sat on the edge of the mattress and watched the names appear.", "w": 7, "e": "2026-08-25-didion-group-chats", "o": "group chats"}, {"t": "It was three in the afternoon in the quiet area, which was not quiet, only dimly lit. A sign on the frosted glass said Executive Lounge, but there were no executives, only tired men in unbuttoned shirts drinking lukewarm San Pellegrino from heavy crystal tumblers. The carpet was navy blue with faint silver grid lines, designed to disguise spills.", "w": 7, "e": "2026-08-25-didion-airport-lounges", "o": "airport lounges"}, {"t": "I have spent four hundred dollars on neck cream because of a man named Arthur who listed his height as six foot one and turned out to be five foot eight in thick loafers. We were at the bar at Michael’s on West Fifty-Fifth Street, and he was explaining his divorce while I looked at his forehead and thought about my own lighting.", "w": 8, "e": "2026-08-25-ephron-dating-apps", "o": "dating apps"}, {"t": "I muted the five of us at nine in the morning on a Tuesday, right after Sarah sent a photo of a turnip. By noon there were forty-two messages, mostly from Jane, who lives on East End Avenue and has never once met a root vegetable she couldn't write three paragraphs about. The trouble with the group is that you cannot leave without committing a public execution.", "w": 8, "e": "2026-08-25-ephron-group-chats", "o": "group chats"}, {"t": "S. had placed the small jar of preserved plums upon the tray precisely where the illuminated arrows indicated, yet the machine, possessing no visible capacity for thought and yet deliberating with an insufferable, polite stillness, immediately flashed a small crimson lamp above its frame to signal that an unscheduled weight had been detected. Although S. knew that he possessed the required coins and that the clerk standing several paces away had seen him place the jar down without any improper intent, it was nonetheless impossible for S. to proceed to the payment slot until this same clerk, who was presently occupied with smoothing the apron of a colleague…", "w": 10, "e": "2026-08-25-kafka-self-checkout-machines", "o": "self-checkout machines"}, {"t": "It was explained to K. that he had paid for the privilege of being locked inside the small, dimly lit parlor, a circumstance which, though presented to him as a form of amusement, seemed to differ very little from his ordinary working life, except that here the authorities had taken the trouble to paint faux-cracks upon the plaster and hide brass keys inside fake hollowed-out volumes of historical treatises.", "w": 10, "e": "2026-08-25-kafka-escape-rooms", "o": "escape rooms"}, {"t": "I am naturally inclined to linger in my bed, where my thoughts settle most agreeably before the demands of the day intrude; yet here is a little brass engine, devised to shatter that quietude by a sudden, violent ringing. I know not what profit a man finds in startling his own soul out of its proper rest: for if slumber be a shadow of death, to wrench ourselves from it by artifice rather than by the gentle invitation of nature seems a kind of daily violence.", "w": 11, "e": "2026-08-25-montaigne-alarm-clocks", "o": "alarm clocks"}, {"t": "I have so little mastery over my own limbs when confined in narrow quarters that I am forever shifting from cheek to cheek, seeking a repose that my restless nature denies me; yet no sooner do I press that small lever to ease my spine by two inches than I feel a sudden pang of shame, knowing I have stolen that same measure of air from the knees of the unoffending gentleman behind me.", "w": 11, "e": "2026-08-25-montaigne-reclining-a-seat-on-a-plane", "o": "reclining a seat on a plane"}, {"t": "The modern soul demands above all things that love be rendered painless—and in doing so, it destroys the very soil out of which love grows. What is this digital market of faces if not the final triumph of the small man, who trembles at the thought of rejection, of conflict, of the violent collision of two wills?", "w": 12, "e": "2026-08-25-nietzsche-dating-apps", "o": "dating apps"}, {"t": "To seek out a lock merely for the pleasure of finding its key—that is the final, pathetic refinement of a race that has forgotten how to bleed. The modern coward demands the thrill of the dungeon, but only on the condition that the gaoler holds the clock and guarantees his supper. Observe these voluntary prisoners: they gather in small, eager herds to solve petty riddles constructed by clerks as hollow as themselves; they cheer when a false door springs open, believing they have achieved a triumph of the spirit.", "w": 12, "e": "2026-08-25-nietzsche-escape-rooms", "o": "escape rooms"}, {"t": "The main trouble with the airport lounge is that it tries to make a man feel like a gentleman by treating him like an invalid. You pay an extra pound or two at the gate, or hold the right strip of cardboard, and at once you are ushered away from the noise of the main hall into a carpeted box where everything is muted, soft, and slightly warm.", "w": 13, "e": "2026-08-25-orwell-airport-lounges", "o": "airport lounges"}, {"t": "If you watch a man at one of these metal tills, you will see that he is doing two things at once: paying for his own bread and doing the shopkeeper's work for him. The shopkeeper saves a wage, and the customer receives nothing in return except the trouble of finding the barcode on a tin of peas.", "w": 13, "e": "2026-08-25-orwell-self-checkout-machines", "o": "self-checkout machines"}, {"t": "The manager was nineteen years old, possessed the flat, dead eyes of a turnpike toll-collector, and he took forty-five of my dollars before slamming a bolted oak door in my face with the hideous, practiced glee of a small-town hanging judge. There were six of us trapped in that velvet-lined dungeon under the strip mall, surrounded by fake books and brass padlocks that smelled faintly of cheap disinfectant and absolute defeat, while a digital clock on the wall shrieked red numbers down toward zero like a missile launch countdown managed by accountants.", "w": 16, "e": "2026-08-25-thompson-escape-rooms", "o": "escape rooms"}, {"t": "Thirty thousand feet above the Oklahoma panhandle, the bastard in 14B unleashed a calculated act of violence against my kneecaps. There was a sickening hydraulic hiss, a sharp metallic click, and suddenly two hundred pounds of sweaty synthetic polyester leaned back into my personal airspace with the quiet, unyielding authority of an armored division taking a border town.", "w": 16, "e": "2026-08-25-thompson-reclining-a-seat-on-a-plane", "o": "reclining a seat on a plane"}, {"t": "A man will sit down before this glass slate and spend three hours declaring himself the most modest creature alive, and another four accepting the tearful congratulations of six hundred strangers for having said so. Now, I am no philosopher, nor do I pretend to fathom the deep workings of modern enterprise, but it seems to me that if a fellow were half as indispensable as he claims on his page, he would scarcely have the leisure to compose forty paragraphs on the profound moral lesson he derived from dropping his toast.", "w": 19, "e": "2026-08-25-twain-linkedin", "o": "LinkedIn"}, {"t": "The practice of receiving an entire volume through the ears, while the hands remain at liberty to trim a bonnet or the feet to wander the shrubbery, is now so generally cultivated as to render the physical opening of a book almost superfluous. It is an arrangement which commends itself singularly to those young ladies who, wishing to be thought accomplished without incurring the fatigue of application, find in an unseen narrator a companion at once indefatigable and admirably restrained from offering opinions of his own.", "w": 2, "e": "2026-08-26-austen-audiobooks", "o": "audiobooks"}, {"t": "The practice of presenting oneself to the world by means of illuminated likenesses, accompanied by a brief testimonial of one’s temper and expectations, has simplified the business of courtship without rendering it notably more agreeable. A young gentleman, having surveyed a hundred countenances in the space of a quarter of an hour, feels himself fully qualified to judge the propriety of an acquaintance before a single sentence has been exchanged.", "w": 2, "e": "2026-08-26-austen-dating-apps", "o": "dating apps"}, {"t": "As I stroll through the bustling streets, my ears are beset on all sides by the murmurs of voices, disembodied and detached from their owners, yet still managing to convey the full force of their emotions. It is a curious thing, this ability to convey the nuances of the human experience through the spoken word alone, without the aid of gestures or facial expressions.", "w": 5, "e": "2026-08-26-dickens-audiobooks", "o": "audiobooks"}, {"t": "As I stroll through the bustling streets, my gaze falls upon a multitude of individuals, their eyes fixed intently on tiny devices strapped to their wrists, their fingers instinctively reaching up to touch them, as if to reassure themselves of their very presence. It is a curious spectacle, this fascination with the step counter, and one that prompts me to ponder the motivations behind such fervent devotion.", "w": 5, "e": "2026-08-26-dickens-the-step-counter", "o": "the step counter"}, {"t": "In the stillness of a store, a lone figure stands before a glassy screen, its fingers dancing across a keypad with a quiet urgency. The soft beep of each item scanned is a gentle reminder of the task at hand, a steady heartbeat that underscores the solitude of this interaction. A sense of detachment settles over the scene, as if the figure is merely a conduit for the flow of goods, a temporary nexus between the shelves and the bag.", "w": 6, "e": "2026-08-26-dickinson-self-checkout-machines", "o": "self-checkout machines"}, {"t": "The step counter's gentle tyranny - it imposes a rhythm on the day, a cadence of footsteps that can be as soothing as a metronome or as jarring as a discordant note. In its presence, the body becomes a kind of instrument, each step a deliberate gesture, a physical manifestation of intention. To wear it is to be reminded of the intricate web of habits and routines that govern our lives, the hidden patterns that shape our movements and our days.", "w": 6, "e": "2026-08-26-dickinson-the-step-counter", "o": "the step counter"}, {"t": "As the sensation of numbness begins to seep into my awareness, like the gentle lapping of waves against a distant shore, I find myself drawn into the peculiar realm of anaesthesia, where the familiar contours of sensation are subtly altered, and the world, once a vibrant tapestry of feeling, is reduced to a muted palette of dulled perceptions, and yet, even as the boundaries of my awareness are thus shifted, I become aware of a strange, almost imperceptible, beauty, a quietude that pervades the space, like the stillness that follows a snowfall, and it is here, in this eerie, suspended landscape, that I begin to grasp the elusive…", "w": 14, "e": "2026-08-26-proust-anaesthesia", "o": "anaesthesia"}, {"t": "As the small, unassuming packet lay before me, its contents waiting to be released from their tightly sealed prison, I found myself pondering the subtle yet profound influence it wielded over our daily lives, a presence as unobtrusive as the gentle hum of a clock in the hallway, yet capable of conjuring entire worlds of relief and solace, much like the soft, golden light that spills from a doorway into a darkened room, illuminating the contours of a space that had previously been shrouded in shadow, and it was this very interplay of light and darkness that seemed to reverberate through my mind…", "w": 14, "e": "2026-08-26-proust-painkillers", "o": "painkillers"}, {"t": "As I stood beneath the hot shower's cascade, I pondered the hours of toil that had earned me this fleeting comfort, and whether the respite from the chill of morning was worth the cost of the fuel that warmed the water. The droplets, like tiny messengers, brought news of distant coal mines and the labours of those who delved into the earth to unearth the black stones that fired the boiler.", "w": 17, "e": "2026-08-26-thoreau-the-hot-shower", "o": "the hot shower"}, {"t": "As I watch people glance at the step counter on their wrist, I am struck by the Faustian bargain they have made, trading the gentle rustle of leaves and the warmth of sunlight on their skin for the cold glow of a screen and the relentless pursuit of a numerical goal. The hours they spend each day pacing back and forth, driven by the insatiable hunger of this tiny tyrant, could be spent exploring the winding trails of the nearby woods, or simply sitting by the river, listening to the water's gentle song.", "w": 17, "e": "2026-08-26-thoreau-the-step-counter", "o": "the step counter"}, {"t": "It's a curious thing, this business of leaning back in a seat while suspended in the air, surrounded by strangers who are also leaning back, or not, as the case may be. You'd think it would be a simple matter, a mere adjustment of one's position to suit their comfort, but no, it seems to be a delicate balance of courtesy and personal space.", "w": 19, "e": "2026-08-26-twain-reclining-a-seat-on-a-plane", "o": "reclining a seat on a plane"}, {"t": "As you settle into the plush armchair, surrounded by the muted hum of conversation and the occasional clinking of glasses, it becomes clear that the lounge is designed to insulate you from the chaos of the terminal, to envelop you in a sense of privilege and exclusivity, which, if you're being honest with yourself, is a feeling you're not entirely sure you deserve, but are more than happy to indulge in, if only for a little while, because what's the harm, really, in pretending to be someone you're not, at least in this fleeting, liminal space, where the rules of everyday life seem to bend and warp…", "w": 20, "e": "2026-08-26-wallace-airport-lounges", "o": "airport lounges"}, {"t": "As you stand there, scanning each item with a mix of precision and apathy, it's hard not to wonder what exactly you're being sold on, besides the obvious convenience, which is really just a euphemism for a subtle reconfiguration of the labor dynamic, where you're now not only the consumer but also the workforce, tasked with the mundane duties of scanning, bagging, and paying, all while being quietly judged by the machine's disembodied voice, which seems to take a perverse pleasure in pointing out your errors, as if to remind you that, even in this ostensibly streamlined process, there's still room for human fallibility, and it's this tension…", "w": 20, "e": "2026-08-26-wallace-self-checkout-machines", "o": "self-checkout machines"}, {"t": "Sidewalks thronged with people, each face intent on a small glass window, fingers brushing against it, a silent tally accumulating - the city's rhythm weaving in and out of footsteps, buses, bicycles, and the steady stream of pedestrians, all as the step counter ticks away, a quiet witness to the ebbs and flows of daily life; in offices, workers sit, eyes fixed on similar small windows, their movements tracked, monitored, a digital record of comings and goings; on streets, in parks, on trails, the step counter accompanies its wearer, a constant, unobtrusive presence, cataloging every step, every stride, every pause; in this vast, intricate tapestry…", "w": 21, "e": "2026-08-26-whitman-the-step-counter", "o": "the step counter"}, {"t": "The pursuit of love has always been a tantalizing game, and now it seems we have devised a way to play it with all the passion and intimacy of a well-curated catalogue. One can hardly blame those who participate, for in the end, is it not more comforting to have one's potential paramours presented with the neatness of a sales display, rather than to risk the unpredictable whims of chance encounters?", "w": 22, "e": "2026-08-26-wilde-dating-apps", "o": "dating apps"}, {"t": "The tendency to congregate in these virtual assemblies is a fascinating spectacle, a testament to our innate desire for connection and communal expression. As we gather in these ephemeral spaces, our thoughts and sentiments are distilled into concise, fleeting missives, a curious amalgam of intimacy and detachment. It is here that the nuances of human interaction are reduced to a sparse, utilitarian prose, stripped of the subtle cadences and inflections that animate our face-to-face encounters.", "w": 22, "e": "2026-08-26-wilde-group-chats", "o": "group chats"}, {"t": "As we settle into the quiet of our daily commute, the sounds of the city giving way to the gentle hum of a narrator's voice, we find ourselves in the presence of a curious thing: a story that unfolds without the rustle of pages or the weight of a book in our hands. The words, carefully chosen and spoken with conviction, weave a tale that is at once intimate and distant, a private world that we inhabit alongside the narrator.", "w": 23, "e": "2026-08-26-woolf-audiobooks", "o": "audiobooks"}, {"t": "As we navigate the labyrinthine corridors of knowledge, we find ourselves confronting a vast and ever-shifting entity, one that embodies the collective efforts of countless individuals. It is an entity that defies traditional notions of authorship and authority, instead embracing a fluid, collaborative ethos. We see in it a reflection of our own desires for connection and understanding, a desire to transcend the limitations of individual perspective and tap into the wisdom of the crowd.", "w": 23, "e": "2026-08-26-woolf-wikipedia", "o": "Wikipedia"}, {"t": "The accumulation of profiles on LinkedIn serves as a testament to the human desire for validation, a craving that is sated by the relentless pursuit of connections and endorsements. It is here that individuals seek to establish their existence, to proclaim their skills and accomplishments to a vast and largely indifferent audience. And yet, in this digital landscape, one finds a peculiar sort of intimacy: the fabricated familiarity that arises from the exchange of brief, formulaic messages, the likes and comments that simulate a sense of community.", "w": 12, "e": "2026-08-26-nietzsche-linkedin", "o": "LinkedIn"}, {"t": "The warm water cascades down - droplets on skin, rivulets on shoulders, trickles down the spine; the sound of it - a steady drumbeat, a soothing hum, a gentle roar; the feel of it - warmth seeping into muscles, relaxation spreading through limbs, tension easing out of the body; the scent of soap and shampoo - fragrant, pungent, sweet; the steam rises - a misty veil, a cloudy shroud, a damp aura; the showerhead above - a metallic flower, a perforated disk, a sprinkle of tiny holes; water pools on the floor - a small lake, a tiny tide, a miniature ocean; the drain swallows it - a gaping mouth…", "w": 21, "e": "2026-08-26-whitman-the-hot-shower", "o": "the hot shower"}, {"t": "Painkillers are a curious thing: they reveal to us the depth of our desire to escape, to flee from the burdens of existence. In taking them, we acknowledge that our lives are not entirely our own, that we are subject to the whims of our bodies and the cruel hand of fate. And yet, in this surrender, we find a strange sort of freedom: the freedom to momentarily forget, to push aside the nagging doubts and fears that plague us.", "w": 12, "e": "2026-08-26-nietzsche-painkillers", "o": "painkillers"}, {"t": "I am currently on intimate terms with two men named Dan who live in Brooklyn and spend two hours every Tuesday explaining the minor characters in 1970s movies. I have never met either Dan. If I passed them outside Fairway on 74th Street, I would not recognize their faces, though I know precisely how Dan Number One takes his espresso and that Dan Number Two has a deeply tragic relationship with his landlord.", "w": 8, "e": "2026-08-26-ephron-podcasts", "o": "podcasts"}, {"t": "Look upon this endless gathering of voices, wherein every man adds his fragment of memory and busies himself correcting the errors of another. Do not marvel at the sheer pile of it, nor suffer thy mind to be drawn into endless wandering among matters that do not concern thy present duty. If a fact recorded there be true and useful, receive it plainly as a tool for the hour, and then cast it aside; for in a little while, both he who inscribed the words and he who reads them will be turned to dust and forgotten.", "w": 1, "e": "2026-08-27-aurelius-wikipedia", "o": "Wikipedia"}, {"t": "The spectacle of a great vessel, constructed at immense expense only to be systematically submerged for the gratification of the public, presents a curious view of modern sentiments. One is invited to admire a young lady of birth and condition who, while engaged to a gentleman of suitable fortune, conceives a sudden and invincible attachment to an itinerant drawer of no visible means.", "w": 2, "e": "2026-08-27-austen-titanic--1997", "o": "Titanic (1997)"}, {"t": "Men will pay two bits of silver to sit in a shaded parlor and shudder at the water, when for the same price they might have bought a stout pair of boots and walked away from the shore altogether. The selectmen of that sandy island weigh human flesh against the seasonal revenue of bathers, calculating that three corpses on the beach are cheaper than a silent July; thus trade always drives men into the gullet of what they cannot bargain with.", "w": 17, "e": "2026-08-27-thoreau-jaws--1975", "o": "Jaws (1975)"}, {"t": "N. had long suspected that the green figures cascading down the screens were not calculation errors in the accounting department, but rather the actual text of the regulations under which he was summoned to work without ever seeing his contract. When solemn men in dark suits informed him that his office was an elaborate deception constructed by machines to extract his life force, N. felt a quiet relief, for it explained why his daily petitions regarding his quarters had gone unanswered.", "w": 10, "e": "2026-08-27-kafka-the-matrix--1999", "o": "The Matrix (1999)"}, {"t": "To insist upon one’s own ugliness in a world obsessed with decorative virtue is not merely a breach of etiquette; it is the highest form of self-respect. The green creature of the swamp understands what the romantic poets so foolishly forgot: that solitude is only charming when it is thoroughly uninviting. He does not ask for our affection, which is precisely why he receives our fascination.", "w": 22, "e": "2026-08-27-wilde-shrek--2001", "o": "Shrek (2001)"}, {"t": "S. had submitted his outer coat, his leather belt, and the small tin container holding his mints to the gray plastic bin, fully expecting that this ritual of divestment, performed with meticulous care under the gaze of the uniformed guard who barely glanced at him, would grant him immediate passage to the waiting hall beyond.", "w": 10, "e": "2026-08-29-kafka-airport-security", "o": "airport security"}, {"t": "The desire to speak to something that has no thoughts of its own is not new, but it used to require a much higher standard of religion. What is new is the sheer speed with which humanity agreed to delegate its polite correspondence to an arrangement of statistics that has never experienced a Tuesday afternoon, yet speaks of them with the calm authority of an estate agent who has read every brochure ever printed.", "w": 0, "e": "2026-08-29-adams-chatbots", "o": "chatbots"}, {"t": "You sit at the corner table and watch a girl in an oversized cardigan spend forty minutes pretending her avocado toast just happened to land in the sunlight. She has a clip-on ring light, an exhausted assistant holding a collapsible reflector, and a plate that goes ice cold while she searches for the right angle of spontaneous delight.", "w": 3, "e": "2026-08-29-bourdain-influencers", "o": "influencers"}, {"t": "Look at the drum and stop panicking about the dial. What you have here is a splendidly vigorous tub that will do all the heavy sloshing for you, provided you give it proper instructions. The real work was never the rubbing anyway; it was knowing what can stand a boiling soak and what will shrink to the size of a tea cozy if you turn your back on it.", "w": 4, "e": "2026-08-29-child-the-washing-machine", "o": "the washing machine"}, {"t": "The mind assigns a fleeting life to these tiny messengers, as if their existence depended on the whims of our attention - a brief glance and they are born, another and they expire. In the crowded marketplace of human expression, they jostle for position, each one a concentrated gesture, a distillation of sentiment. Their appeal lies not in their durability, but in their ephemerality, for they can be summoned and dismissed with equal ease, leaving behind only the faintest impression of their presence.", "w": 6, "e": "2026-08-29-dickinson-emojis", "o": "emojis"}, {"t": "As I walked away from the tale of Paddington, I found myself struck by the manner in which the filmmakers had woven a narrative that was at once both fantastical and mundane, a curious blend of the ordinary and the extraordinary. The attention to detail in the creation of this world was striking, with each frame meticulously crafted to transport the viewer to a London that was both familiar and yet, utterly unique.", "w": 5, "e": "2026-08-29-dickens-paddington--2014", "o": "Paddington (2014)"}, {"t": "In the ordinary course of events, a person will encounter a self-checkout machine and attempt to use it, which is to say they will try to complete a transaction without the assistance of another human being, a goal that is not always achieved. The machine, having been designed to perform a specific set of tasks, will often perform those tasks, but not always in a way that is useful to the person trying to use it, which can lead to a certain amount of frustration.", "w": 0, "e": "2026-08-29-adams-self-checkout-machines", "o": "self-checkout machines"}, {"t": "You stand in the security line, surrounded by the murmur of conversation and the rustle of belongings being removed from bags, and you can't help but think of the people who make this machine run. The ones who scan your tickets, who wave the wand over your carry-on, who watch the screens with a mixture of boredom and vigilance.", "w": 3, "e": "2026-08-29-bourdain-airport-security", "o": "airport security"}, {"t": "Now, as you sit in one of these airport lounges, you may find yourself wondering if all the fuss is worth it, but I say, perfectly well, it is a haven from the chaos outside. The moment you step in, you are enveloped in a sense of calm, and the amenities, while not extravagant, are perfectly sufficient to make your wait a pleasant one.", "w": 4, "e": "2026-08-29-child-airport-lounges", "o": "airport lounges"}, {"t": "I have been observing the workings of a certain online platform, wherein individuals may showcase their professional accomplishments and connect with others in their field; and I must say, the notion of it is intriguing, though its practical applications are not entirely clear to me. It appears to be a venue where one may publish their credentials and experience, in the hopes of attracting the attention of potential employers or collaborators; yet, I wonder whether the time and effort expended in maintaining a presence on this platform are truly justified by the potential benefits.", "w": 9, "e": "2026-08-29-franklin-linkedin", "o": "LinkedIn"}, {"t": "I have given some attention to the device that washes clothing without the need for manual labour; it appears to be a contraption of considerable complexity, with many moving parts and a significant consumption of water. The cost of acquiring and maintaining such a device is not inconsiderable; I have been informed that it can be a substantial expense, one that may not be justified for those with limited means.", "w": 9, "e": "2026-08-29-franklin-the-washing-machine", "o": "the washing machine"}, {"t": "A man who produces nothing of utility to his fellow men, who neither tills the soil nor shapes the wood nor weaves the cloth, now presides over the minds of millions merely by displaying the false abundance of his own idle existence. This public exhibition of luxury, which the educated classes accept as a legitimate occupation and even as a form of guidance, is in truth nothing other than a perfected system of temptation, designed to awaken in simple men the corrupting desire for things they do not need and cannot afford.", "w": 18, "e": "2026-08-29-tolstoy-influencers", "o": "influencers"}, {"t": "The relentless pursuit of self-promotion that drives individuals to participate in LinkedIn is a stark reminder of the emptiness that lies at the heart of modern professional life, where people are reduced to mere commodities, their worth measured by the number of connections they have amassed and the endorsements they have received, rather than the actual value of their work, and it is this endless cycle of self-aggrandizement that serves only to further entrench the existing power structures, where those who are already privileged are able to leverage their influence to accumulate even more…", "w": 18, "e": "2026-08-29-tolstoy-linkedin", "o": "LinkedIn"}, {"t": "It seems to me that the people who spend their days telling others what to buy and how to live are a curious sort, rather like a travelling salesman who has forgotten what it is he's peddling. They have a way of making you feel like you're the only person in the room, even when they're speaking to thousands, and that's a mighty clever trick.", "w": 19, "e": "2026-08-29-twain-influencers", "o": "influencers"}, {"t": "Nothing pleases an ordinary man quite so much as discovering that his neighbor is mistaken. We are, by nature, a disputatious species, far more interested in proving our acquaintances wrong than in arriving at any useful truth ourselves. It was long assumed that such petty vanity was an obstacle to learning; one required quiet scholars in secluded libraries to preserve knowledge.", "w": 15, "e": "2026-08-29-russell-wikipedia", "o": "Wikipedia"}, {"t": "We have constructed an engine of public self-congratulation, and we call it professional networking. On LinkedIn, every clerk announces that he is delighted to have spent his weekend compiling a memorandum no one will read. I have noticed in my own heart the same vulgar desire to display modest triumphs whenever I fear I am being forgotten, so I cannot judge the vanity of others too severely.", "w": 15, "e": "2026-08-29-russell-linkedin", "o": "LinkedIn"}, {"t": "It is a remarkable comfort to live in an age where a man no longer needs to carry a heavy burden of ignorance around in his own head, when he can so easily borrow the ignorance of several million complete strangers. If a fellow wishes to know the exact weight of a whale or the year a bad king caught the measles, he needs only consult that great communal inkwell where every passerby is invited to stir the soup.", "w": 19, "e": "2026-08-29-twain-wikipedia", "o": "Wikipedia"}, {"t": "Walking was once the last refuge of the man who wished to think about nothing at all. Now it has been converted into an audited task. One straps a tiny accountant to one's wrist and sets off, not to admire the scenery, but to satisfy a digital master. I find myself pacing around my own study late at night, not because I have a thought to pursue, but because I am four hundred strides short of an arbitrary figure set by some distant manufacturer.", "w": 15, "e": "2026-08-30-russell-the-step-counter", "o": "the step counter"}, {"t": "The readiness with which Mr. Brown surrenders the tranquil governance of his household to a creature of the South American wilderness speaks less of extraordinary benevolence than of that weakness of mind which cannot withstand a persistent display of vulnerability. One must admire the fortitude of Mrs. Brown, who discovers in the total destruction of her bathroom not an occasion for censure, but a compelling proof of the stranger's sweetness of disposition.", "w": 2, "e": "2026-08-31-austen-paddington--2014", "o": "Paddington (2014)"}, {"t": "The grey-faced bastards in the blue polyester shirts have finally perfected the art of the pre-flight strip search. They stand under the fluorescent tubes with their rubber gloves and their little plastic bins, demanding my belt, my shoes, and my soul before I even get a whiff of jet fuel. It is a massive, mechanized humiliation engine designed by terrified middle-managers to ensure that every free citizen walks through the steel archway looking like a plucked chicken, shivering in his socks while a machine that costs more than a small country scans his liver for treason.", "w": 16, "e": "2026-09-01-thompson-airport-security", "o": "airport security"}, {"t": "To relieve the female arm of its most laborious domestic duty must be regarded as an act of considerable mercy, though it deprives the lower order of cottagers of their most reliable source of honest income. That an iron cabinet, supplied with water and lather, should accomplish in an hour what formerly occupied three stout maidservants for a day, is an invention which few housewives can contemplate without secret satisfaction.", "w": 2, "e": "2026-09-01-austen-the-washing-machine", "o": "the washing machine"}, {"t": "I was seized from the outset by the monstrous, unrelenting insistence of the furniture. It is not enough that the colossal iron hull should break its back in the shrieking midnight; it is not enough that hundreds of poor wretches should be flung into the freezing ocean like so much discarded trash; no, we are compelled to watch mahogany sideboards, gilded mirrors, and silver soup tureens slide with a hideous, deliberate elegance into the dark.", "w": 5, "e": "2026-09-01-dickens-titanic--1997", "o": "Titanic (1997)"}]}</script>

<script>
/* Guess the writer. Ten passages, four names under each, and a link into the essay
   once you have answered.

   The round is drawn fresh on every load rather than fixed at build time, so the page

(function () {
  var root = document.getElementById('quiz');

  var data = JSON.parse(blob.textContent);
  var ROUND = Math.min(10, data.qs.length);
  var order, at, right, log;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i];
      a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function pill(w) {
    /* The same portrait pill as the writers roster. A writer whose portrait has not
       been drawn yet gets the name alone rather than a broken image. */
    var b = el('button', w.face ? '' : 'plain');
    b.type = 'button';
    if (w.face) {
      var img = document.createElement('img');
      img.className = 'face'; img.src = 'faces/' + w.id + '.jpg'; img.alt = '';
      img.width = 58; img.height = 58; img.loading = 'lazy';
      b.appendChild(img);
    }
    b.appendChild(document.createTextNode(w.name));
    return b;
  }

  function start() {
    order = shuffle(data.qs.map(function (_, i) { return i; })).slice(0, ROUND);
    at = 0; right = 0; log = [];
    ask();
  }

  function prog() {
    /* Redrawn on the answer as well as on the question. Left to the question alone
       it lagged a step: you got one right, a green tick said so, and the counter
       above it still read 0. A running total that is only right between turns is
       not a running total. */
    root.querySelector('.qprog').textContent =
      (at + 1) + ' of ' + ROUND + ' \u00b7 ' + right + ' right';
  }

  function ask() {
    var q = data.qs[order[at]];
    var pool = data.writers.map(function (_, i) { return i; })
      .filter(function (i) { return i !== q.w; });
    var opts = shuffle(shuffle(pool).slice(0, 3).concat([q.w]));

    root.textContent = '';
    root.appendChild(el('p', 'qprog', ''));
    prog();
    root.appendChild(el('blockquote', 'qtext', q.t));

    var box = el('div', 'opts');
    opts.forEach(function (i) {
      var b = pill(data.writers[i]);
      b.addEventListener('click', function () { answer(q, i, box); });
      box.appendChild(b);
    });
    root.appendChild(box);
    root.appendChild(el('div', 'qafter'));
  }

  function answer(q, picked, box) {
    var hit = picked === q.w;
    if (hit) right++;
    log.push({ q: q, picked: picked, hit: hit });
    prog();

    /* Mark the answer green wherever it is, and the wrong pick red. Both, so a wrong
       guess still tells you who it actually was. */
    Array.prototype.forEach.call(box.children, function (b) {
      b.disabled = true;
      var name = b.textContent;
      if (name === data.writers[q.w].name) b.classList.add('is-right');
      else if (!hit && name === data.writers[picked].name) b.classList.add('is-wrong');
    });

    var after = root.querySelector('.qafter');
    after.setAttribute('role', 'status');
    var link = document.createElement('a');
    link.href = 'e/' + q.e + '.html';
    link.textContent = data.writers[q.w].name + ' on ' + q.o;
    after.appendChild(link);
    var next = el('button', 'qbtn', at + 1 < ROUND ? 'Next' : 'How you did');
    next.type = 'button';
    next.addEventListener('click', function () {
      at++;
      if (at < ROUND) ask(); else done();
    });
    after.appendChild(next);
    next.focus();
  }

  function done() {
    root.textContent = '';
    root.appendChild(el('p', 'qscore', 'You got ' + right + ' of ' + ROUND + '.'));
    var ul = el('ul', 'list');
    log.forEach(function (r) {
      var w = data.writers[r.q.w];
      ul.insertAdjacentHTML('beforeend',
        '<li><a href="e/' + esc(r.q.e) + '.html"><span class="t">' + esc(w.name) +
        ' <span class="thing">on ' + esc(r.q.o) + '</span></span>' +
        '<span class="rate"><span class="verdict">' +
        (r.hit ? '' : 'you said ' + esc(data.writers[r.picked].name)) +
        '</span><span class="score ' + (r.hit ? 's-good' : 's-bad') + '">' +
        (r.hit ? '\u2713' : '\u2717') + '</span></span></a></li>');
    });
    root.appendChild(ul);
    var again = el('button', 'qbtn', 'Play again');
    again.type = 'button';
    again.addEventListener('click', start);
    root.appendChild(again);
    /* Deliberately NOT again.focus(). Focusing the button scrolls it into view, and
       it sits under ten rows: on a phone that lands the reader at the bottom of the
       list with their score off the top of the screen, which is the one thing they
       just asked to see. Scroll only when the score is genuinely above the fold. */
    if (root.getBoundingClientRect().top < 0) root.scrollIntoView({ block: 'start' });
  }

  start();
})();
</script>

  <p class="foot"></p>
</div>
<script>
  (function(){
    var r=document.documentElement,b=document.getElementById("tog");
    function sync(){b.textContent=r.getAttribute("data-theme")==="dark"?"Light":"Dark";}
    sync();
    b.addEventListener("click",function(){
      var light=r.getAttribute("data-theme")!=="light";
      r.setAttribute("data-theme",light?"light":"dark");
      try{localStorage.setItem("dy-theme",light?"light":"dark");}catch(e){}
      sync();
    });
  })();
</script>
</body>
