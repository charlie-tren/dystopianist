eir blisters. Nobody remembers putting it there. Nobody, in a bad hour, fails to find it.", "w": 25, "e": "2026-10-06-woolf-painkillers", "o": "painkillers"}, {"t": "A picture is shown to children and to their parents, and both are taught by it to laugh at the very things on which every real feeling between men depends. That is what must first be said of this film. It tells of a creature who wishes to be left alone, and it ends, as it must, with his being rewarded by a wife and by the approval of the crowd; but it does not tell the viewer to examine his own life, it tells him only that he is already good enough, and that whatever is solemn, tender or sacred in the old tales deserves mockery.", "w": 20, "e": "2026-10-06-tolstoy-shrek--2001", "o": "Shrek (2001)"}, {"t": "The underlying principle of the household washing machine relies on a fundamental misunderstanding of the relationship between time and mathematics. Engineered to spare human beings the indignity of manual labour against flat stones in a cold river, the device achieves this by introducing a cycle timer that operates under its own entirely private system of arithmetic.", "w": 0, "e": "2026-10-07-adams-the-washing-machine", "o": "the washing machine"}, {"t": "The step counter reports the march and knows nothing of the ground. Ten thousand paces on a flat road and ten thousand on a mountain pass are written down as the same labour. The commander who trusts the figure alone will judge his soldiers by the wrong measure. If the total is low, ask where the man has been before you call him idle.", "w": 17, "e": "2026-10-07-suntzu-the-step-counter", "o": "the step counter"}, {"t": "Somebody had been in the pipes again. I knew it the moment I turned the handle at four in the morning, wired and sweating and sure the whole building was listening, and the water came down on my skull like a verdict, hot, instant, obedient, with no warning and no rattle in the walls and no ten-minute wait while some half-dead boiler in the basement made up its mind.", "w": 18, "e": "2026-10-08-thompson-the-hot-shower", "o": "the hot shower"}, {"t": "A man who is read to while he scrubs a floor, drives to his office, or walks from one place to another has not been given a book; he has been given a voice to fill the hours in which he might have been obliged to think. That is what is wrong with it, and nothing in its convenience alters this.", "w": 20, "e": "2026-10-08-tolstoy-audiobooks", "o": "audiobooks"}, {"t": "The button is on the armrest, and the seat goes back four inches, perhaps five. It is a measured thing. Somewhere there is a drawing with the angle on it. Over Nebraska, a little after the cart has passed, the man in 23C presses it, and I feel the table come toward my sternum with a small plastic click.", "w": 8, "e": "2026-10-08-didion-reclining-a-seat-on-a-plane", "o": "reclining a seat on a plane"}, {"t": "The alarm clock is the only instrument in the house that is set by one person and obeyed by another, and the two have never been properly introduced. The first, who sets it at eleven at night, is rested in spirit, well disposed towards the future, and quite certain that six in the morning is an arrangement between reasonable adults.", "w": 0, "e": "2026-10-09-adams-alarm-clocks", "o": "alarm clocks"}, {"t": "Reading aloud was once the privilege of the nursery and the vice of the clergy, and we have now made it a convenience, which is the surest way of ruining anything. I am told that one may finish a novel while washing the dishes. I do not doubt it. I merely observe that the novel is finished and the dishes are, in every moral sense, unwashed.", "w": 24, "e": "2026-10-09-wilde-audiobooks", "o": "audiobooks"}, {"t": "I had not walked three paces along the thoroughfare when my pocket began to buzz with the ferocious insistence of a hornet trapped in a pillbox, signalling that fifteen distant acquaintances had simultaneously determined to express an opinion upon a sandwich. There is no escape from this unseen parlour, where every member of the company talks at once, none listens, and all demand that I acknowledge their breathless drivel with an immediate nod of the thumb.", "w": 6, "e": "2026-10-09-dickens-group-chats", "o": "group chats"}, {"t": "At 9:40 on a Tuesday night I was marching in place in my kitchen on Central Park West, in my bathrobe, next to the Zabar's bag, because my Fitbit said I was 312 steps short of ten thousand. Nobody was watching. That is what I want you to understand. Nobody was watching, and I was doing it anyway, with the kind of dignity you associate with a person trying to hail a cab in a flood.", "w": 9, "e": "2026-10-10-ephron-the-step-counter", "o": "the step counter"}, {"t": "When the glowing rectangle on the writing-desk illuminates with that frantic, intermittent cadence of interrupted messages—resembling nothing so much as those intricate mechanical clockwork theatres in which miniature figures emerge from separate gilded doors to strike their chimes before instantly vanishing—I am struck less by the triviality of the remarks than by the subtle optical distortion they inflict upon our solitude.", "w": 15, "e": "2026-10-10-proust-group-chats", "o": "group chats"}, {"t": "To surrender the shoe is an unexpected humility, as though the porch required our ankles before the parlor would allow our name. We line our small possessions in a grey dish—the key that knows no locks here, the coin that cannot buy a bird—and offer them to an eye that does not wink. It is a strange parish where every stranger is suspected of carrying thunder in his sleeve.", "w": 7, "e": "2026-10-10-dickinson-airport-security", "o": "airport security"}, {"t": "A man I know has a phone that buzzes forty times during dinner, and he will not turn it over. It is his family, he says, or his cousins, or the lads from the football club; he belongs to eleven of them. He reads each message with a small frown, as though it were a summons, and then he types a thumb and a laugh in reply.", "w": 14, "e": "2026-10-11-orwell-group-chats", "o": "group chats"}, {"t": "The Master said, 'To be summoned to duty before one's own resolve has awakened is like putting on a winter garment while the frost is still forming upon the ground. In morning duties, some attend because they are startled by an abrupt ringing, some because they wish to preserve their standing among neighbours, and some because their inward rhythm demands that they realise the daylight.", "w": 5, "e": "2026-10-11-confucius-alarm-clocks", "o": "alarm clocks"}, {"t": "The anaesthetist at St. Vincent's was named Dr. Pruitt, and he told me to count backward from ten, and I decided, with what I can only call a competitor's heart, that I would make it to six. I made it to eight. This is the whole of my testimony. Eight, and then a kind of edit, not a darkness, since darkness is something you'd have to be present to notice, but a splice, the two ends of the afternoon pressed together with no visible seam.", "w": 22, "e": "2026-10-11-wallace-anaesthesia", "o": "anaesthesia"}, {"t": "I have always been clumsy in the marketplace, yet I found myself today standing before that glowing glass pedestal, attempting to act as my own tradesman. I must confess my fingers proved singularly unfit for the task; for no sooner had I mislaid a small loaf upon the designated platform than an unyielding metallic voice declared my error to the entire room.", "w": 12, "e": "2026-10-12-montaigne-self-checkout-machines", "o": "self-checkout machines"}, {"t": "Mrs. Hartley, who has kept a housemaid these twenty years and a cold bedchamber for rather longer, was lately persuaded to try the water that falls from the ceiling, and has spoken of little else since. It comes, she says, without the labour of a single can being carried up the stairs, and continues warm for exactly as long as one is disposed to stand beneath it, which, as she observes with some candour, is a good deal longer than one had intended.", "w": 2, "e": "2026-10-12-austen-the-hot-shower", "o": "the hot shower"}, {"t": "I have long held that the hour of rising is a bargain struck between a man and his bed, and that the bargain is kept only so far as the penalty for breaking it exceeds the pleasure of the breach. The alarm clock is a contrivance for fixing that penalty at the moment it is wanted, and for charging it to a machine, so that the sleeper may afterwards quarrel with brass and not with himself.", "w": 10, "e": "2026-10-12-franklin-alarm-clocks", "o": "alarm clocks"}, {"t": "Eight people locked in a cellar with a padlock and a riddle, and not one of them has thought to read the instructions. I watched this happen to my own imagination, and I tell you it is exactly how most kitchens run on a Saturday night. Somebody holds the clue, somebody else is shouting, and the soup is burning while the real answer sits in plain view on the shelf.", "w": 4, "e": "2026-10-13-child-escape-rooms", "o": "escape rooms"}, {"t": "I had gone to it that morning merely to learn the year in which a certain duchess had married, and I came away, an hour later, having read the lineage of a Hanoverian cavalry regiment, the etymology of a sauce, and the whole obscure quarrel of two bishops, as though the little blue word on which my eye had rested, and which promised only a date, had been one of those doors in a large house which you open expecting a cupboard and which gives instead upon a corridor, and the corridor upon a gallery, and the gallery, lit by some window you had never suspected from the street…", "w": 15, "e": "2026-10-13-proust-wikipedia", "o": "Wikipedia"}, {"t": "A man lies on a table, his body is opened, and he feels nothing; this is announced as the greatest mercy ever given to mankind, and the educated classes repeat it to one another until no one thinks to ask what it is a mercy for. Pain is the oldest signal that something in a man's life is wrong.", "w": 20, "e": "2026-10-13-tolstoy-anaesthesia", "o": "anaesthesia"}, {"t": "The Master said, \"In a place where many people wait, we may see how some use their time to prepare for what is to come, while others use it to indulge in what is readily available.\" The Master said, \"The wise traveller is mindful of his journey, and uses the waiting time to collect his thoughts; the virtuous traveller is considerate of his fellow passengers, and uses the waiting time to show kindness; and the bold traveller is undaunted by the uncertainty of his journey, and uses the waiting time to plan his next steps.\" The Master said, \"I myself have waited in such places…", "w": 5, "e": "2026-10-14-confucius-airport-lounges", "o": "airport lounges"}, {"t": "As I stroll through the bustling streets, my eyes chancing upon the countless individuals who hasten to and fro, I find myself pondering the wondrous concoctions that have insinuated themselves into our daily lives, those tiny, insidious tablets that promise to vanquish the pangs of suffering, to still the raging tempests of pain that beset our mortal coils, and I am struck by the sheer audacity of their claims, for what a marvel, what a wonder, that a mere pill, a tiny, insignificant speck of matter, can purportedly wield such vast and mysterious powers, can calm the troubled waters of our minds and bodies…", "w": 6, "e": "2026-10-14-dickens-painkillers", "o": "painkillers"}, {"t": "People put their working lives on show for all to see, like a shopkeeper displaying his wares in the window. They write about what they do and who they know, and they collect endorsements from their acquaintances, as if these were valuable coins to be stored away. It is a strange thing, this need to prove oneself to the world, to demonstrate one's usefulness and importance, not just to one's employer or colleagues, but to anyone who cares to look.", "w": 14, "e": "2026-10-14-orwell-linkedin", "o": "LinkedIn"}, {"t": "I have noticed that people who rely on alarm clocks to wake them are often the same ones who complain about the drudgery of their daily routines; it is as if they are trapped in a cycle of monotony, and the alarm clock is the constant reminder of their enslavement to it. We use these devices to jolt ourselves out of bed, to shock ourselves into a state of wakefulness, and yet we rarely stop to consider why we need such a drastic measure in the first place.", "w": 16, "e": "2026-10-14-russell-alarm-clocks", "o": "alarm clocks"}, {"t": "I reckon the folks who made Titanic were trying to spin a yarn that'd get us all teary-eyed and invested in the tale of those poor souls on the ship. They went to great lengths to recreate the whole shebang, from the fancy dresses to the sinking of the vessel itself, and I'll be darned if it didn't look like the real deal.", "w": 21, "e": "2026-10-15-twain-titanic--1997", "o": "Titanic (1997)"}, {"t": "The sorrow that clings to Titanic is a garment that can be worn, its folds heavy with the weight of lives lost, and the desperation that comes with loving in the face of doom - a love that tries on the utmost, and finds it terribler than any existence could bear. In its grandeur, the ship is a domestic anchor, a hearth that warms and devours, leaving only the bitter taste of what could never be.", "w": 7, "e": "2026-10-15-dickinson-titanic--1997", "o": "Titanic (1997)"}, {"t": "The step counter, that most fastidious of companions, is forever tallying our every move, as if the very measure of our existence depended on the number of paces we take. And yet, in its zealous pursuit of precision, it betrays a singular lack of discernment, for what, pray, is the distinction between a step taken with purpose and one taken in idle reverie?", "w": 24, "e": "2026-10-16-wilde-the-step-counter", "o": "the step counter"}, {"t": "As the minutes ticked by, it seemed that the procedure to administer anaesthesia was nearing its culmination, although it was not entirely clear to what extent the presence of the attendant was a necessity, given that the equipment itself appeared to be functioning in a satisfactory manner, and yet, it became apparent that the progression of the treatment was contingent upon the verification of certain documents, which, owing to a miscommunication regarding the filing system, were not readily available, thus necessitating a brief, though indefinite, postponement, during which time the patient, who had been prepared for the procedure, was obliged to wait…", "w": 11, "e": "2026-10-16-kafka-anaesthesia", "o": "anaesthesia"}, {"t": "Good manners are far too serious a matter to be entrusted to the English, who have always confused cold civility with true kindness; it takes a bear from Peru to instruct London in the art of hospitality. The film presents us with a metropolitan world painted in the most charming pastel hues, turning a dreary terrace house into a perfectly functioning dollhouse of human eccentricity.", "w": 24, "e": "2026-10-16-wilde-paddington--2014", "o": "Paddington (2014)"}, {"t": "The town council of Amity offers the eternal spectacle of bourgeois cowardice: it would rather sacrifice its own children to an unseen sea-monster than forfeit a single week of summer profit. This film understands that fear is far more potent when hidden than when revealed—a mechanical failure forced the director to delay the beast's appearance, and in doing so, he elevated a simple spectacle into an exercise in psychological dread.", "w": 13, "e": "2026-10-17-nietzsche-jaws--1975", "o": "Jaws (1975)"}, {"t": "The habit of presenting oneself to strangers in the most favourable light has become a commonplace of modern life, and nowhere is this more evident than in the curated profiles that populate dating apps. A person's entire character is reduced to a handful of photographs and a brief description, a kind of verbal thumbnail that is meant to entice and persuade.", "w": 14, "e": "2026-10-17-orwell-dating-apps", "o": "dating apps"}, {"t": "The indulgence in these auditory entertainments has become a prevalent aspect of many a person's daily routine, affording them a convenient means of acquainting themselves with a wide range of subjects and ideas, often without necessitating a considerable expenditure of mental effort. Whilst this ease of access to information may be seen as a desirable circumstance, it is not uncommon for the listener to find their attention wandering, as the mind, unaccustomed to such a surfeit of idle speculation, begins to rebel against the constant barrage of thoughts and opinions.", "w": 2, "e": "2026-10-17-austen-podcasts", "o": "podcasts"}, {"t": "The water was hot, and that was the first difficulty, since a warmth so freely given seemed to require some form of acknowledgement, and I could not discover to whom it should be addressed. The pipes ran into the wall behind the tiles, the wall belonged to the house, the house belonged to a man who lived, so I was told, on the other side of the river and who had never been seen by anyone I knew to turn a tap.", "w": 11, "e": "2026-10-18-kafka-the-hot-shower", "o": "the hot shower"}, {"t": "The curious thing about Paddington is that it asks for nothing but good manners, and gets it. A bear arrives from Peru with a label round his neck and a hat on his head, and the whole film turns on whether anyone will trouble to be civil to him. Most are not. The crowd at the station walks past.", "w": 14, "e": "2026-10-18-orwell-paddington--2014", "o": "Paddington (2014)"}, {"t": "A man who belongs to a group chat belongs to a crowd that he cannot leave without giving offence, and that he cannot remain in without giving up his time, his attention, and at last his judgement. Forty people, most of whom he would not cross the road to visit, send him through the day a stream of remarks, pictures and agreements, and he answers each of them, because to be silent is to be noticed, and to be noticed is the thing he fears.", "w": 20, "e": "2026-10-18-tolstoy-group-chats", "o": "group chats"}, {"t": "Look behind you before you do it. That is the whole of the method, and I am astonished at how many people skip it. A reclined seat is a lid coming down on a pot, and the person in the seat behind is the pot. If you have not noticed whether there is a laptop open, or a cup of coffee balanced on the tray, or a pair of knees already pressed against the plastic, you have no business pushing the button.", "w": 4, "e": "2026-10-19-child-reclining-a-seat-on-a-plane", "o": "reclining a seat on a plane"}, {"t": "I met him on the Hungerford stairs at eleven at night, a respectable man of fifty with the collar of a deacon, and he was laughing. He was laughing alone, at nothing, at the river, at the lamp, with his mouth open and his head thrown back, as if the very fog had told him a joke.", "w": 6, "e": "2026-10-19-dickens-podcasts", "o": "podcasts"}, {"t": "My grandmother's cure for toothache was a clove held against the gum and a good deal of patience. It did not work very well, and nobody pretended it did. The tooth went on aching until it was pulled, and in the meantime one learned what an ache was, how it rose at night and fell in the morning, and how far it could be borne.", "w": 14, "e": "2026-10-20-orwell-painkillers", "o": "painkillers"}, {"t": "The man in the next lane was moving his lips. Not singing, not cursing, just mouthing along to something only he could hear, and when we stalled together at the light on Route 9 I saw the little glowing rectangle on his dashboard and the title scrolling across it, a novel I had once read in a motel in Tucson with a wet towel under the door and a very bad conscience.", "w": 18, "e": "2026-10-20-thompson-audiobooks", "o": "audiobooks"}, {"t": "There is a particular voice that lives in the machine at the end of the aisle, and it says, with the serenity of a governess who has never been contradicted, that there is an unexpected item in the bagging area. Nothing is there but a lemon. Yet we stand, the lemon and I, convicted, while a small light turns on above our heads like a flag run up over a fortress, and across the shop a girl in a green apron begins, without haste, to walk towards us.", "w": 25, "e": "2026-10-20-woolf-self-checkout-machines", "o": "self-checkout machines"}, {"t": "Thou wilt be asked to remove thy belt. Remove it. The belt was never thine in any way that matters. Thou wilt stand in a line. A line is only men waiting, and thou art one of them.", "w": 1, "e": "2026-10-20-aurelius-airport-security", "o": "airport security"}, {"t": "The airport lounge works on a principle that would be familiar to anyone who has studied the medieval sale of indulgences: you pay a considerable sum so that you may wait in a better place for the thing you are already waiting for. The thing does not arrive any sooner. It is simply that, while it fails to arrive, you are permitted to sit in a chair that was chosen by someone who had once read about chairs.", "w": 0, "e": "2026-10-21-adams-airport-lounges", "o": "airport lounges"}, {"t": "The Master said, 'When a man is asked to take off his belt and his shoes before strangers, and does so without complaint, I do not yet know whether he is patient or only tired.' The Master said, 'The officer who looks into my bag may be diligent, or fearful, or merely obedient. The diligent look at the traveller.", "w": 5, "e": "2026-10-21-confucius-airport-security", "o": "airport security"}, {"t": "The marmalade sandwich under the hat is the thing I keep thinking about. Not the sandwich itself, which is a joke, but the fact that he keeps it there for emergencies, the way my mother kept a twenty-dollar bill folded into the toe of a boot. Paddington is a bear who has been told that London will be kind, and the movie's whole nerve is that it lets him be wrong for about an hour and a half and then makes him right anyway.", "w": 9, "e": "2026-10-22-ephron-paddington--2014", "o": "Paddington (2014)"}, {"t": "What strikes me, when the face of one of these young women appears on the little lit pane of my telephone, recommending with a radiance of perfectly rehearsed spontaneity a serum, a hotel in the Maldives, a way of folding linen, is not that she is lying, for she is probably sincere, but that her sincerity has been so thoroughly lit from every side, like those portraits by fashionable painters in which the sitter's pearls are rendered with such care that we begin to suspect the sitter herself was added afterwards to give the pearls somewhere to hang…", "w": 15, "e": "2026-10-22-proust-influencers", "o": "influencers"}, {"t": "I have been told that a man may now listen to two strangers talk for three hours about a subject on which neither is an authority, and that millions do so willingly. My first impulse was to condemn this. My second was to remember how I have spent a good many evenings, and to hold my tongue.", "w": 16, "e": "2026-10-22-russell-podcasts", "o": "podcasts"}, {"t": "I went to see the ogre because I was told he lived in a swamp, and I confess I was prepared to like any man who would. He has the sense to keep a mud-hole of his own, a onion for his supper, and a sign on his fence; he asks of the world only that it stay on the far side of the post.", "w": 19, "e": "2026-10-22-thoreau-shrek--2001", "o": "Shrek (2001)"}, {"t": "A dinner party for twelve works because someone decides who sits where. Put the same twelve people in a room with no host, no table and no hour at which to go home, and you have a group chat. I cannot say I admire it. Consider what goes wrong. Everyone speaks at once, nobody waits for the sauce to finish, and a question about Saturday is answered on Tuesday by someone who has plainly not read the first forty messages.", "w": 4, "e": "2026-10-23-child-group-chats", "o": "group chats"}, {"t": "A small face carries a message that a paragraph cannot, and a paragraph carries a message the face cannot. The commander who knows the difference wins the exchange before it begins. If the message is an order, send no face with it. A smile laid upon a command tells the soldier it may be argued.", "w": 17, "e": "2026-10-23-suntzu-emojis", "o": "emojis"}, {"t": "The little faces arrived on my table in the morning, as they do every morning, without any signature, so that I could not say whether the sender intended the one with the tears of laughter to be read as joy or as the exhaustion that follows a very long joke at the sender's own expense.", "w": 11, "e": "2026-10-23-kafka-emojis", "o": "emojis"}, {"t": "There is a particular species of household in which the hour of rising has always been a matter of the most delicate negotiation, and it is to such families that the little bell upon the washstand must be thought a peculiar blessing, or a peculiar affront, according to the temper of the person it addresses.", "w": 2, "e": "2026-10-24-austen-alarm-clocks", "o": "alarm clocks"}, {"t": "The green writing is the best thing in the film. It runs down the screen in a cascade of letters, and when Neo is shown how to read it he sees a woman in a red dress where the others see only code. After that the film has little left to show us, and spends two hours showing it anyway.", "w": 14, "e": "2026-10-24-orwell-the-matrix--1999", "o": "The Matrix (1999)"}, {"t": "What I had not foreseen, when the machine said in its level, unaccusing voice that there was an unexpected item in the bagging area, was that I should feel myself suspected by no one, and that this absence of a accuser would prove more difficult to bear than any accusation; for a shopkeeper's glance, however unjust, at least confers on the person it falls upon a certain solidity, as the disapproval of a duchess, for those who have never been admitted to her salon, fixes them in a definite place on the social map…", "w": 15, "e": "2026-10-24-proust-self-checkout-machines", "o": "self-checkout machines"}, {"t": "The Master said, 'When a man is praised by the whole village, I do not yet know whether he is good. When he is praised by the good in the village and disliked by the bad, then I begin to know.' Of those who are followed by many thousands and are known to none of them, what shall be said?", "w": 5, "e": "2026-10-25-confucius-influencers", "o": "influencers"}, {"t": "The first thing I ever did in a real restaurant kitchen that anybody thanked me for was run the whites. Aprons, side towels, the chef's jackets with the sleeves stiff as cardboard from veal stock and clarified butter. A Speed Queen in the basement, bolted to a floor that was always wet, next to the dry storage and a mop bucket nobody had emptied since the Carter administration.", "w": 3, "e": "2026-10-25-bourdain-the-washing-machine", "o": "the washing machine"}, {"t": "Consider the grey plastic tray, which has no business to be moving us as it does. Into it go the shoes, still warm from the foot, and the belt that held up one's dignity, and the little coins that have been rattling companionably in a pocket since morning; and there they lie, under the strip lights, like the contents of a drowned man's pockets laid out for identification.", "w": 25, "e": "2026-10-25-woolf-airport-security", "o": "airport security"}, {"t": "Thou hast a voice in thy ear all day. Ask who is doing the thinking. Another man has read the book. Another man has chosen the pace, the pauses, the weight on each word. Thou hast only to sit still and be carried.", "w": 1, "e": "2026-10-26-aurelius-audiobooks", "o": "audiobooks"}, {"t": "I came out of that picture-house with my hat in my hand, and I have no recollection of taking it off. Let the reader who has seen the thing say whether he, too, did not walk home along the dry middle of the road, at a respectful distance from every gutter, kerb, and puddle in the parish.", "w": 6, "e": "2026-10-27-dickens-jaws--1975", "o": "Jaws (1975)"}]}</script>

<script>
/* Guess the writer. Ten passages, four names under each, and a link into the essay
   once you have answered.

   The round is drawn fresh on every load rather than fixed at build time, so the page
   is worth opening twice. Nothing is stored: a score kept in localStorage would turn a
   two-minute game into a record you can spoil by reloading. */
(function () {
  var root = document.getElementById('quiz');
  var blob = document.getElementById('quiz-data');
  if (!root || !blob) return;
  var data = JSON.parse(blob.textContent);
  var ROUND = Math.min(10, data.qs.length);
  var order, at, right, log;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i];
      a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function pill(w) {
    /* The same portrait pill as the writers roster. A writer whose portrait has not
       been drawn yet gets the name alone rather than a broken image. */
    var b = el('button', w.face ? '' : 'plain');
    b.type = 'button';
    if (w.face) {
      var img = document.createElement('img');
      img.className = 'face'; img.src = 'faces/' + w.id + '.jpg'; img.alt = '';
      img.width = 58; img.height = 58; img.loading = 'lazy';
      b.appendChild(img);
    }
    b.appendChild(document.createTextNode(w.name));
    return b;
  }

  function start() {
    order = shuffle(data.qs.map(function (_, i) { return i; })).slice(0, ROUND);
    at = 0; right = 0; log = [];
    ask();
  }

  function prog() {
    /* Redrawn on the answer as well as on the question. Left to the question alone
       it lagged a step: you got one right, a green tick said so, and the counter
       above it still read 0. A running total that is only right between turns is
       not a running total. */
    root.querySelector('.qprog').textContent =
      (at + 1) + ' of ' + ROUND + ' \u00b7 ' + right + ' right';
  }

  function ask() {
    var q = data.qs[order[at]];
    var pool = data.writers.map(function (_, i) { return i; })
      .filter(function (i) { return i !== q.w; });
    var opts = shuffle(shuffle(pool).slice(0, 3).concat([q.w]));

    root.textContent = '';
    root.appendChild(el('p', 'qprog', ''));
    prog();
    root.appendChild(el('blockquote', 'qtext', q.t));

    var box = el('div', 'opts');
    opts.forEach(function (i) {
      var b = pill(data.writers[i]);
      b.addEventListener('click', function () { answer(q, i, box); });
      box.appendChild(b);
    });
    root.appendChild(box);
    root.appendChild(el('div', 'qafter'));
  }

  function answer(q, picked, box) {
    var hit = picked === q.w;
    if (hit) right++;
    log.push({ q: q, picked: picked, hit: hit });
    prog();

    /* Mark the answer green wherever it is, and the wrong pick red. Both, so a wrong
       guess still tells you who it actually was. */
    Array.prototype.forEach.call(box.children, function (b) {
      b.disabled = true;
      var name = b.textContent;
      if (name === data.writers[q.w].name) b.classList.add('is-right');
      else if (!hit && name === data.writers[picked].name) b.classList.add('is-wrong');
    });

    var after = root.querySelector('.qafter');
    after.setAttribute('role', 'status');
    var link = document.createElement('a');
    link.href = 'e/' + q.e + '.html';
    link.textContent = data.writers[q.w].name + ' on ' + q.o;
    after.appendChild(link);
    var next = el('button', 'qbtn', at + 1 < ROUND ? 'Next' : 'How you did');
    next.type = 'button';
    next.addEventListener('click', function () {
      at++;
      if (at < ROUND) ask(); else done();
    });
    after.appendChild(next);
    next.focus();
  }

  function done() {
    root.textContent = '';
    root.appendChild(el('p', 'qscore', 'You got ' + right + ' of ' + ROUND + '.'));
    var ul = el('ul', 'list');
    log.forEach(function (r) {
      var w = data.writers[r.q.w];
      ul.insertAdjacentHTML('beforeend',
        '<li><a href="e/' + esc(r.q.e) + '.html"><span class="t">' + esc(w.name) +
        ' <span class="thing">on ' + esc(r.q.o) + '</span></span>' +
        '<span class="rate"><span class="verdict">' +
        (r.hit ? '' : 'you said ' + esc(data.writers[r.picked].name)) +
        '</span><span class="score ' + (r.hit ? 's-good' : 's-bad') + '">' +
        (r.hit ? '\u2713' : '\u2717') + '</span></span></a></li>');
    });
    root.appendChild(ul);
    var again = el('button', 'qbtn', 'Play again');
    again.type = 'button';
    again.addEventListener('click', start);
    root.appendChild(again);
    /* Deliberately NOT again.focus(). Focusing the button scrolls it into view, and
       it sits under ten rows: on a phone that lands the reader at the bottom of the
       list with their score off the top of the screen, which is the one thing they
       just asked to see. Scroll only when the score is genuinely above the fold. */
    if (root.getBoundingClientRect().top < 0) root.scrollIntoView({ block: 'start' });
  }

  start();
})();
</script>

<script>
  (function(){
    var r=document.documentElement,b=document.getElementById("tog");
    function sync(){var t=r.getAttribute("data-theme")==="dark"?"Light":"Dark";
      b.querySelector(".lbl").textContent=t;b.setAttribute("aria-label","Switch to "+t.toLowerCase()+" theme");}
    sync();
    b.addEventListener("click",function(){
      var light=r.getAttribute("data-theme")!=="light";
      r.setAttribute("data-theme",light?"light":"dark");
      try{localStorage.setItem("dy-theme",light?"light":"dark");}catch(e){}
      sync();
