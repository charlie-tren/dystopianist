# Things none of them lived to see.
#
# `writers` is the shortlist for that object - the voices with a specific reason to
# have an opinion on it rather than a general one. The pairing prefers these until
# they are spent, so the early essays are the strong matchups; after that it falls
# back to the whole roster, because part of the point is a writer meeting something
# they have no natural claim on.
objects:
  - name: self-checkout machines
    writers: [kafka, orwell, wallace]
  - name: alarm clocks
    writers: [aurelius, montaigne, kafka]
  - name: group chats
    writers: [wilde, ephron, didion]
  - name: airport lounges
    writers: [didion, wallace, orwell]
  - name: dating apps
    writers: [wilde, nietzsche, ephron]
  - name: LinkedIn
    writers: [twain, nietzsche, wilde]
  - name: reclining a seat on a plane
    writers: [montaigne, twain, thompson]
  - name: escape rooms
    writers: [kafka, thompson, nietzsche]
  # Added 26/08/2026. Everything above is a modern irritation, which is why the
  # first 17 essays averaged 1.8 out of 10 and none cleared 4.5 - the roster was
  # never handed anything it could like. These are things a writer could plausibly
  # admire, or genuinely split on.
  - name: anaesthesia
    writers: [whitman, montaigne, proust]
  - name: the hot shower
    writers: [whitman, thoreau, montaigne]
  - name: painkillers
    writers: [nietzsche, montaigne, proust]
  - name: Wikipedia
    writers: [woolf, wilde, twain]
  - name: audiobooks
    writers: [dickens, woolf, austen]
  - name: podcasts
    writers: [thoreau, wilde, ephron]
  - name: the step counter
    writers: [thoreau, dickens, whitman]

  # FILMS. Added 26/08/2026, chosen by Charlie from a list of twenty.
  #
  # A film carries a `year`, and that is not decoration: the premise of the site is
  # that none of them lived to see the thing, so a writer may only be set on a film
  # released AFTER they died. Didion is the latest death at 2021, so a 2022 film is
  # open to the whole roster while a 1975 one is closed to the four moderns. `pick`
  # enforces it and test_roster asserts it, because the pairing falls back to the
  # WHOLE roster once the shortlists are spent and that fallback is exactly where a
  # writer who had seen the film would otherwise turn up.
  - name: Jaws (1975)
    kind: film
    year: 1975
    writers: [twain, thoreau, montaigne]
  - name: The Matrix (1999)
    kind: film
    year: 1999
    writers: [nietzsche, proust, kafka]
  - name: Titanic (1997)
    kind: film
    year: 1997
    writers: [austen, dickens, wilde]
  - name: Shrek (2001)
    kind: film
    year: 2001
    writers: [wilde, twain, montaigne]
  - name: Paddington 2 (2017)
    kind: film
    year: 2017
    writers: [dickens, austen, woolf]
