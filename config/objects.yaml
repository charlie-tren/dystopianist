# Things none of them lived to see. The pairing thinker x object is the anti-repeat
# axis: 8 thinkers x 40 objects is 320 pairs, so a daily site does not repeat a pair
# for the better part of a year even before the "no thinker twice in a row" rule.
#
# Keep these SMALL and ordinary. "Artificial intelligence" is a subject; "the
# unsubscribe flow" is an object, and the essay has somewhere to stand.
