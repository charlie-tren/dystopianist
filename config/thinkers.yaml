# One entry per writer. `shot` is the whole mechanism: the variety comes from each
# writer carrying its own example, not from a shared prompt asking for variety - a
# longer instruction loses to a few-shot every time.
#
# EVERY `shot` HERE IS PASTICHE, WRITTEN FOR THIS REPO. None is a real quotation.
# Deliberate on two counts: several of these writers are still in copyright, and a
# real excerpt in a repo is a reproduction. It also keeps each shot tuned to the
# sentence SHAPE we want copied.
#
# KNOWN LIMITATION, and the next thing to fix. Imitating a pastiche is a copy of a
# copy, and it is the likeliest reason output reads only broadly like its author.
# `public_domain: true` marks the writers whose real prose could legally be the shot
# instead - the plan is to pull actual text from Project Gutenberg (free, keyless,
# already used by The Lindy Effect) rather than to type quotes from memory, which
# risks publishing a misquotation as if it were real.

thinkers:
  - id: wallace
    name: David Foster Wallace
    dates: 1962-2008
    public_domain: false
    note: >-
      Recursive and self-interrupting. Long sentences that qualify themselves mid-clause.
      Sincerity smuggled in under irony. Second-person drift. Ends by turning the object
      back on the narrator.
    shot: >-
      And but so the thing about the waiting room is that it is engineered, clearly, by
      someone who understood that the worst part of waiting is not the time but the
      self-consciousness of being seen to wait, i.e. that what you want, secretly, is not
      to be called in sooner but to be relieved of the full-time job of arranging your face.

  - id: orwell
    name: George Orwell
    dates: 1903-1950
    public_domain: true
    note: >-
      Plain, concrete, declarative. Short Anglo-Saxon words in preference to long Latin
      ones. Political meaning found in a small domestic detail. Suspicious of any phrase
      that saves the speaker from thinking.
    shot: >-
      The tea is served in a thick white cup, and the cup is the point. Nobody decided it
      should be thick; it simply became easier to defend the cup than to explain the tea.
      A dozen small surrenders of this kind will do more than any decree.

  - id: twain
    name: Mark Twain
    dates: 1835-1910
    public_domain: true
    shot_source: "Life on the Mississippi (1883), Project Gutenberg #245"
    note: >-
      Conversational, tall-tale cadence. Builds a reasonable-sounding case and lets it
      collapse under its own politeness. Homely comparisons, a narrator who claims less
      intelligence than he has, and one deadpan sentence at the end that does the damage.
    shot: >-
      Now, if I wanted to be one of those ponderous scientific people, and 'let on' to prove
      what had occurred in the remote past by what had occurred in a given time in the
      recent past, or what will occur in the far future by what has occurred in late years,
      what an opportunity is here! Geology never had such a chance, nor such exact data to
      argue from!

  - id: wilde
    name: Oscar Wilde
    dates: 1854-1900
    public_domain: true
    shot_source: "Preface to The Picture of Dorian Gray (1891), Project Gutenberg #174"
    note: >-
      Epigram, paradox, and the inversion of a received opinion. Elegant, unhurried,
      pleased with itself in a way that earns it. Prefers to be witty about a serious
      thing rather than serious about a witty one.
    shot: >-
      There is no such thing as a moral or an immoral book. Books are well written, or badly
      written. That is all. We can forgive a man for making a useful thing as long as he
      does not admire it. The only excuse for making a useless thing is that one admires it
      intensely. All art is quite useless.

  - id: aurelius
    name: Marcus Aurelius
    dates: 121-180
    public_domain: true
    shot_source: "Meditations, tr. Meric Casaubon, Project Gutenberg #2680"
    note: >-
      Second person, addressed to himself. Short admonitions, one idea each. Nature,
      death and proportion invoked plainly, without ornament. Never argues with anyone
      else - only with his own impatience.
    shot: >-
      What art and profession soever thou hast learned, endeavour to affect it, and comfort
      thyself in it; and pass the remainder of thy life as one who from his whole heart
      commits himself and whatsoever belongs unto him, unto the gods: and as for men, carry
      not thyself either tyrannically or servilely towards any.

  - id: kafka
    name: Franz Kafka
    dates: 1883-1924
    public_domain: true
    shot_source: "The Trial, tr. David Wyllie, Project Gutenberg #7849"
    note: >-
      Bureaucratic dread told calmly. Long subordinate clauses that qualify a permission
      into an obstruction. The protagonist is always nearly finished and never finished.
      No anger, only patience - which is worse.
    shot: >-
      At last, K. was by himself. It did not enter his head to show anyone else into his
      office and only became vaguely aware of how nice it was that the people outside
      thought he was still negotiating with the manufacturer and, for this reason, he could
      not let anyone in to see him, not even the servitor.

  - id: thompson
    name: Hunter S Thompson
    dates: 1937-2005
    public_domain: false
    note: >-
      First person, accelerating. Piles clauses until the sentence is out of control, then
      lands a short one. Paranoid, funny, morally certain in the middle of chaos. Names
      things as enemies.
    shot: >-
      We were somewhere past the third roundabout when the machine began to speak, and I
      understood immediately that it had been designed by a committee of insurance men who
      had never once been afraid of anything. It wanted my postcode. It was going to get it.

  - id: didion
    name: Joan Didion
    dates: 1934-2021
    public_domain: false
    note: >-
      Cool, exact, unsettling. Repeats a phrase until it changes meaning. Reports the
      surface - the brand, the temperature, the time - and lets the dread sit underneath
      it, unmentioned. Never raises her voice.
    shot: >-
      The room was cold and the light was the light they use in places where nobody stays.
      I remember the carpet. I remember thinking that someone had chosen the carpet, that
      this had been a decision, made by a person, in a meeting, on an ordinary afternoon.
