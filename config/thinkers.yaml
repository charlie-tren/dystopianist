# One entry per thinker. `shot` is the whole mechanism: the variety comes from
# each thinker carrying its own example, not from a shared prompt asking for
# variety - a longer instruction loses to a few-shot every time.
#
# EVERY `shot` HERE IS PASTICHE, WRITTEN FOR THIS REPO. None is a real quotation.
# That is deliberate on two counts: several of these writers are still in
# copyright, and a real excerpt in a public repo is a reproduction. It also keeps
# the shots tuned to the job - each one is the sentence SHAPE we want copied.

thinkers:
  - id: wallace
    name: David Foster Wallace
    dates: 1962-2008
    note: >-
      Recursive and self-interrupting. Long sentences that qualify themselves mid-clause.
      Sincerity smuggled in under irony. Second-person drift. Ends by turning the object
      back on the narrator.
    shot: >-
      And but so the thing about the waiting room is that it is engineered, clearly, by
      someone who understood that the worst part of waiting is not the time but the
      self-consciousness of being seen to wait, i.e. that what you want, secretly, is not
      to be called in sooner but to be relieved of the full-time job of arranging your face.

  - id: diogenes
    name: Diogenes of Sinope
    dates: c.412-323 BC
    note: >-
      Blunt, physical, aphoristic. Short sentences. Answers with an action or an insult
      rather than an argument. Contempt for possessions and for the effort of acquiring them.
    shot: >-
      You have built a house with many rooms so that you may be alone in each of them. You
      call me a dog because I sleep in a jar; the jar has never asked me for anything. Get
      out of my sunlight.

  - id: veblen
    name: Thorstein Veblen
    dates: 1857-1929
    note: >-
      Deadpan pseudo-academic. Latinate, unhurried. Treats status display as an economic
      function and never once says a thing is silly. Words like pecuniary, honorific,
      invidious, reputability.
    shot: >-
      The consumption of a costly article is a means of reputability to the gentleman of
      leisure; and conversely, the failure to consume in due quantity becomes a mark of
      demerit. It is not that the article is more serviceable, but that it is more honorific.

  - id: orwell
    name: George Orwell
    dates: 1903-1950
    note: >-
      Plain, concrete, declarative. Short Anglo-Saxon words in preference to long Latin
      ones. Political meaning found in a small domestic detail. Suspicious of any phrase
      that saves the speaker from thinking.
    shot: >-
      The tea is served in a thick white cup, and the cup is the point. Nobody decided it
      should be thick; it simply became easier to defend the cup than to explain the tea.
      A dozen small surrenders of this kind will do more than any decree.

  - id: parker
    name: Dorothy Parker
    dates: 1893-1967
    note: >-
      Short, dry, wounded. Sets up a polite sentence and detonates it in the last four
      words. First person. Never explains the joke, never repeats it.
    shot: >-
      I was told the evening would be intimate, which is the word people use when they
      have run out of chairs. I stayed until the host began describing his renovation. I
      have been to warmer funerals.

  - id: bierce
    name: Ambrose Bierce
    dates: 1842-c.1914
    note: >-
      Mock-lexicographic and pitiless. Often a definition, delivered straight, whose second
      clause removes the floor. No warmth, no hedging, no first person.
    shot: >-
      COMMITTEE, n. A body of persons appointed to decide that nothing can be decided,
      and to record the fact at length, so that the record may be consulted by a later
      committee appointed for the same purpose.

  - id: ballard
    name: J G Ballard
    dates: 1930-2009
    note: >-
      Cool, clinical, present tense. Treats the psychological as landscape and the landscape
      as symptom. Finds the erotic and the catastrophic in car parks and business hotels.
      No moralising - the flatness is the horror.
    shot: >-
      The multi-storey car park had become the site of a private ceremony. He parked on the
      fourth level each evening, where the ramp's curve reproduced almost exactly the angle
      of the accident, and sat with the engine running until the light failed.

  - id: debord
    name: Guy Debord
    dates: 1931-1994
    note: >-
      Aphoristic and total. Numbered-thesis cadence. Everything is an image of a relation
      rather than the relation. Declarative, never illustrative; refuses the example.
    shot: >-
      The image of leisure is what remains of leisure once it has been organised. What is
      offered as rest is the representation of rest, and the worker who accepts it consumes
      his own absence, which has been prepared for him with great care.
